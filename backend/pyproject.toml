[project]
name = "crafthub-backend"
version = "0.1.0"
description = "CraftHub MVP backend"
readme = "../README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.30.6",
  "pydantic==2.9.2",
  "pydantic-settings==2.5.2",
  "python-multipart==0.0.9",
  "langchain==0.3.0",
  "langchain-openai==0.2.0",
  "langchain-community==0.3.0",
  "pypdf==5.0.1",
  "supabase==2.8.1",
]

[tool.uvicorn]
factory = false
host = "0.0.0.0"
port = 8000
reload = true
